<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories ❤️</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(135deg,#667eea,#764ba2);

    font-family:Poppins,sans-serif;

    color:white;

    overflow:hidden;

}



/* Main Card */

.container{

    width:90%;

    max-width:550px;

    background:rgba(255,255,255,0.15);

    backdrop-filter:blur(15px);

    padding:20px;

    border-radius:25px;

    text-align:center;

    box-shadow:0 10px 40px rgba(0,0,0,.3);

    animation:show 1s;

}



h1{

    font-size:32px;

    margin-bottom:15px;

}



/* Photo Area */

.photo-box{

    width:260px;

    height:320px;

    margin:auto;

    border-radius:20px;

    overflow:hidden;

    box-shadow:0 8px 25px rgba(0,0,0,.5);

}



.photo-box img{

    width:100%;

    height:100%;

    object-fit:cover;

    animation:fade 1s;

}



/* Caption */

#caption{

    font-size:18px;

    margin-top:15px;

}



/* Button */

button{

    margin-top:20px;

    padding:12px 35px;

    border:none;

    border-radius:30px;

    background:#ff4081;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}


button:hover{

    transform:scale(1.08);

}



/* Animation */

@keyframes fade{

    from{

        opacity:0;

        transform:scale(.9);

    }


    to{

        opacity:1;

        transform:scale(1);

    }

}



@keyframes show{

    from{

        opacity:0;

        transform:translateY(30px);

    }


    to{

        opacity:1;

        transform:translateY(0);

    }

}



/* Mobile */

@media(max-width:600px){


.container{

    padding:15px;

}


h1{

    font-size:26px;

}


.photo-box{

    width:220px;

    height:280px;

}


#caption{

    font-size:16px;

}


button{

    margin-top:15px;

}



}

</style>


</head>



<body>



<div class="container">


<h1>
❤️ Our Beautiful Memories ❤️
</h1>



<div class="photo-box">

<img id="photo" src="photo1.jpg">

</div>



<div id="caption">

Our first beautiful memory ❤️

</div>



<button onclick="location.href='message.html'">

Next 💌

</button>



</div>





<script>


let photos=[

"photo1.jpg",

"photo2.jpg",

"photo3.jpg",

"photo4.jpg",

"photo5.jpg"

];



let captions=[

"Our first beautiful memory ❤️",

"Beautiful moments together 😊",

"Friendship forever ✨",

"Unforgettable days 💙",

"Forever best friends ❤️"

];



let index=0;



setInterval(function(){


index++;


if(index >= photos.length){

    index=0;

}



let img=document.getElementById("photo");



img.style.animation="none";



setTimeout(()=>{


img.src=photos[index];


img.style.animation="fade 1s";


},100);



document.getElementById("caption").innerHTML=
captions[index];



},3000);



</script>


</body>

</html>
